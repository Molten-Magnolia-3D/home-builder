name: Publish Home Builder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: publish-home-builder
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps

      - name: Version
        id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Upload Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Pages
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Home Builder ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/home-builder-web.zip
          make_latest: true
